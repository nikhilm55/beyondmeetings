[project]
name = "beyondmeetings"
version = "0.1.0"
description = "Local meeting recorder, transcriber and note generator for Obsidian"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "keyring>=24.0",
    "tomli-w>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.scripts]
beyondmeetings = "beyondmeetings.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-httpx>=0.30", "httpx>=0.27", "pyyaml>=6.0"]
tray = ["pystray>=0.19", "pillow>=10.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beyondmeetings"]

[tool.hatch.build.targets.wheel.force-include]
"src/beyondmeetings/web" = "beyondmeetings/web"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
