[project]
name = "beyondmeetings"
version = "0.1.0"
description = "Local meeting recorder, transcriber and note generator for Obsidian"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "keyring>=24.0",
    "tomli-w>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.scripts]
beyondmeetings = "beyondmeetings.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-httpx>=0.30", "httpx>=0.27", "pyyaml>=6.0", "build>=1.0"]
tray = ["pystray>=0.19", "pillow>=10.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `packages` already includes every file under the directory, web assets
# included. A force-include of web/ on top added them a second time at the
# same path, which hatchling rejects — it broke every non-editable install
# while `pip install -e .` kept working.
packages = ["src/beyondmeetings"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
