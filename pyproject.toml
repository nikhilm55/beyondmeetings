[project]
name = "beyondmeetings"
version = "0.1.0"
description = "Private cross-platform meeting recorder and local notes app"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "keyring>=24.0",
    "tomli-w>=1.0",
    # Reading TOML: tomllib is stdlib only from 3.11, and requires-python
    # still allows 3.10 (Ubuntu 22.04's system Python).
    'tomli>=2.0; python_version < "3.11"',
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "platformdirs>=4.0",
    "fpdf2>=2.7,<3",
    # WASAPI loopback + microphone capture. Installed only on Windows.
    'SoundCard>=0.4.3; sys_platform == "win32"',
]

[project.scripts]
beyondmeetings = "beyondmeetings.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-httpx>=0.30", "httpx>=0.27", "pyyaml>=6.0", "build>=1.0"]
tray = ["pystray>=0.19", "pillow>=10.0"]
desktop = [
    'pywebview[qt]>=5.0,<7; sys_platform == "linux"',
    'pywebview>=5.0,<7; sys_platform != "linux"',
    # Cross-platform fallback when a native Linux AppIndicator is unavailable.
    "pystray>=0.19",
    "pillow>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `packages` already includes every file under the directory, web assets
# included. A force-include of web/ on top added them a second time at the
# same path, which hatchling rejects — it broke every non-editable install
# while `pip install -e .` kept working.
packages = ["src/beyondmeetings"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
