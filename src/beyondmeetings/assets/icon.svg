<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img"
     aria-label="beyondMeetings">
  <defs>
    <linearGradient id="bm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c7ff5"/>
      <stop offset="1" stop-color="#5457e0"/>
    </linearGradient>
  </defs>

  <!-- Rounded tile: reads cleanly at 48px in the Ubuntu dock. -->
  <rect x="16" y="16" width="224" height="224" rx="56" fill="url(#bm-bg)"/>

  <!-- Microphone: the most legible "records audio" glyph at small sizes. -->
  <rect x="108" y="66" width="40" height="74" rx="20" fill="#fff"/>
  <path d="M92 128a36 36 0 0 0 72 0" fill="none" stroke="#fff"
        stroke-width="13" stroke-linecap="round"/>
  <path d="M128 164v22" fill="none" stroke="#fff"
        stroke-width="13" stroke-linecap="round"/>

  <!-- Waveform under the mic: hints "transcribed", not just "recorded". -->
  <g stroke="#fff" stroke-width="11" stroke-linecap="round" opacity="0.92">
    <path d="M74 202v-16"/>
    <path d="M101 202v-28"/>
    <path d="M155 202v-28"/>
    <path d="M182 202v-16"/>
  </g>
</svg>
